<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="description" content="Professional Facebook Ads, Google Ads, SEO, Shopify Development, Website Design and Social Media Marketing Services in Pakistan.">
<meta name="keywords" content="Digital Marketing, Facebook Ads, Google Ads, SEO, Shopify, Website Development, Pakistan">

<meta property="og:image" content="images/logo.webp">

<style>
/* ==========================================================================
   Usama Digital - Stylesheet
   Direction: "Performance Dashboard" - deep ink-navy canvas, a signal-teal
   growth accent, and a coral energy accent for calls to action. Mono
   data-tags (CTR, ROAS) echo the ad-metrics world this agency lives in.
   ========================================================================== */

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');

:root {
  --bg: #0b0f1a;
  --bg-alt: #121826;
  --bg-card: #151d2e;
  --ink: #edebe3;
  --muted: #9aa3b2;
  --accent: #00d9a3;
  --accent-2: #ff6b4a;
  --line: rgba(237, 235, 227, 0.1);

  --font-display: 'Poppins', sans-serif;
  --font-body: 'Poppins', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;

  --container: 1160px;
  --radius: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }
ul { list-style: none; }

.container {
  max-width: var(--container);
  margin: 0 auto;
  padding: 0 24px;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}

h5 {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 10px;
}

h5::before { content: '// '; color: var(--accent-2); }

h2 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(28px, 4vw, 42px);
  letter-spacing: -0.01em;
  margin-bottom: 16px;
}

/* Header / Navbar */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11, 15, 26, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.navbar {
  max-width: var(--container);
  margin: 0 auto;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.logo h2 { font-size: 21px; letter-spacing: -0.01em; margin: 0; }
.logo h2::after { content: '.'; color: var(--accent); }

.nav-links { display: flex; gap: 32px; }

.nav-links a {
  font-size: 15px;
  color: var(--muted);
  transition: color 0.2s ease;
}

.nav-links a:hover { color: var(--ink); }

.btn {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 500;
  padding: 10px 20px;
  border-radius: 100px;
  background: var(--accent);
  color: #06120e;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 217, 163, 0.25);
}

/* Hero */

.hero {
  max-width: var(--container);
  margin: 0 auto;
  padding: 90px 24px 70px;
  display: grid;
  grid-template-columns: 1.15fr 0.85fr;
  gap: 48px;
  align-items: center;
  background-image:
    linear-gradient(var(--line) 1px, transparent 1px),
    linear-gradient(90deg, var(--line) 1px, transparent 1px);
  background-size: 44px 44px;
  background-position: center top;
}

.hero-text h4 {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--accent-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.hero-text h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(34px, 5.2vw, 58px);
  line-height: 1.1;
  letter-spacing: -0.02em;
  margin-bottom: 22px;
}

.hero-text p {
  color: var(--muted);
  font-size: 17px;
  max-width: 46ch;
  margin-bottom: 32px;
}

.hero-btns { display: flex; gap: 16px; flex-wrap: wrap; }

.btn-primary,
.btn-secondary {
  font-size: 15px;
  font-weight: 500;
  padding: 14px 28px;
  border-radius: 100px;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
  display: inline-block;
}

.btn-primary { background: var(--accent-2); color: #1a0a05; }

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(255, 107, 74, 0.3);
}

.btn-secondary { border: 1px solid var(--line); color: var(--ink); }

.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

.hero-image {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.hero-image::before {
  content: 'CTR UP 24%';
  position: absolute;
  top: -14px;
  left: 24px;
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--accent);
  color: #06120e;
  padding: 6px 12px;
  border-radius: 100px;
  font-weight: 500;
}

.hero-image::after {
  content: 'ROAS 4.2x';
  position: absolute;
  bottom: -14px;
  right: 24px;
  font-family: var(--font-mono);
  font-size: 12px;
  background: var(--accent-2);
  color: #1a0a05;
  padding: 6px 12px;
  border-radius: 100px;
  font-weight: 500;
}

/* About */

.about .container {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  gap: 56px;
  align-items: center;
  padding-top: 90px;
  padding-bottom: 90px;
  border-top: 1px solid var(--line);
}

.about-img img { border-radius: var(--radius); border: 1px solid var(--line); }

.about-content p { color: var(--muted); margin-bottom: 32px; max-width: 56ch; }

.about-box {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  margin-bottom: 32px;
}

.box {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px 16px;
  text-align: center;
}

.box i { font-size: 20px; color: var(--accent); margin-bottom: 10px; }
.box h4 { font-family: var(--font-mono); font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.box p { color: var(--muted); font-size: 13px; }

/* Services */

.services {
  background: var(--bg-alt);
  padding: 90px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.services .container { text-align: center; }
.services h2 { max-width: 40ch; margin: 0 auto 48px; }

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  text-align: left;
}

.service-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 32px 26px;
  transition: transform 0.25s ease, border-color 0.25s ease;
}

.service-card:hover { transform: translateY(-6px); border-color: var(--accent); }
.service-card i { font-size: 26px; color: var(--accent); margin-bottom: 18px; }
.service-card h3 { font-size: 19px; font-weight: 600; margin-bottom: 10px; }
.service-card p { color: var(--muted); font-size: 14.5px; }

/* Portfolio */

.portfolio { padding: 90px 0; }
.portfolio .container { text-align: center; }
.portfolio h2 { margin: 0 auto 48px; }

.portfolio-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  text-align: left;
}

.portfolio-item {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}

.portfolio-item img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; }
.portfolio-item h3 { padding: 18px 20px; font-size: 16px; font-weight: 500; }

/* Testimonials */

.testimonials {
  background: var(--bg-alt);
  padding: 90px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.testimonials .container { text-align: center; }
.testimonials h2 { margin: 0 auto 48px; }

.testimonial {
  max-width: 640px;
  margin: 0 auto 24px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 32px;
}

.testimonial p { color: var(--ink); font-size: 16px; margin-bottom: 16px; }
.testimonial h4 { font-family: var(--font-mono); font-size: 13px; color: var(--muted); font-weight: 500; }

/* FAQ */

.faq { padding: 90px 0; }
.faq .container { max-width: 760px; }
.faq h2 { text-align: center; margin-bottom: 40px; }

.faq-item { border-bottom: 1px solid var(--line); padding: 22px 0; }
.faq-item h3 { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
.faq-item p { color: var(--muted); font-size: 15px; }

/* Contact */

#contact {
  background: var(--bg-alt);
  padding: 90px 0;
  border-top: 1px solid var(--line);
}

#contact .container { max-width: 640px; text-align: center; }
#contact h2 { margin-bottom: 32px; }

#contact form { display: flex; flex-direction: column; gap: 16px; text-align: left; }

#contact input,
#contact textarea {
  width: 100%;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  resize: vertical;
  transition: border-color 0.2s ease;
}

#contact input::placeholder,
#contact textarea::placeholder { color: var(--muted); }

#contact input:focus,
#contact textarea:focus { border-color: var(--accent); outline: none; }

#contact button {
  align-self: flex-start;
  border: none;
  cursor: pointer;
  font-family: var(--font-body);
}

/* Footer */

footer { padding: 60px 0 40px; text-align: center; border-top: 1px solid var(--line); }
footer h2 { font-size: 24px; margin-bottom: 8px; }
footer > .container > p { color: var(--muted); margin-bottom: 24px; }

.social { display: flex; justify-content: center; gap: 14px; margin-bottom: 24px; }

.social a {
  width: 40px;
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--muted);
  transition: all 0.2s ease;
}

.social a:hover { color: var(--bg); background: var(--accent); border-color: var(--accent); }

footer > .container > p:last-child { font-size: 13px; color: var(--muted); margin-bottom: 0; }

/* WhatsApp FAB */

.whatsapp {
  position: fixed;
  bottom: 26px;
  right: 26px;
  width: 56px;
  height: 56px;
  background: #25d366;
  color: #06120e;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  box-shadow: 0 10px 24px rgba(37, 211, 102, 0.35);
  z-index: 200;
  animation: pulse 2.4s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { box-shadow: 0 10px 24px rgba(37, 211, 102, 0.35); }
  50% { box-shadow: 0 10px 30px rgba(37, 211, 102, 0.55); }
}

/* Responsive */

@media (max-width: 900px) {
  .hero, .about .container { grid-template-columns: 1fr; }
  .hero-image { order: -1; }
  .service-grid, .portfolio-grid { grid-template-columns: repeat(2, 1fr); }
  .about-box { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 640px) {
  .nav-links { display: none; }
  .navbar { justify-content: space-between; }
  .service-grid, .portfolio-grid, .about-box { grid-template-columns: 1fr; }
  .hero { padding-top: 60px; }
}

/* ==========================================================================
   Extended sections: nav toggle/theme, mission & vision, why-us, pricing,
   blog, testimonial grid, contact layout, cookie banner, light mode.
   ========================================================================== */

/* Light mode (toggled via .light-mode on <body>) */
body.light-mode {
  --bg: #f6f5f0;
  --bg-alt: #ffffff;
  --bg-card: #ffffff;
  --ink: #12151c;
  --muted: #5b6472;
  --line: rgba(18, 21, 28, 0.1);
}

body.light-mode .hero-image::before { color: #06120e; }
body.light-mode .whatsapp { color: #06120e; }

/* Nav toggle (mobile) + theme toggle + nav actions */

.nav-toggle {
  display: none;
  background: none;
  border: 1px solid var(--line);
  color: var(--ink);
  width: 40px;
  height: 40px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}

.theme-toggle {
  background: none;
  border: 1px solid var(--line);
  color: var(--muted);
  width: 38px;
  height: 38px;
  border-radius: 50%;
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

/* About: mission & vision */

.mission-vision {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 32px;
}

.mv-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
}

.mv-card h4 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.mv-card h4 i { color: var(--accent); }
.mv-card p { color: var(--muted); font-size: 14px; }

/* Portfolio stat tags */

.portfolio-info {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.portfolio-info h3 { padding: 0; font-size: 16px; font-weight: 500; }

.stat-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
  border: 1px solid var(--line);
  padding: 4px 10px;
  border-radius: 100px;
  white-space: nowrap;
}

/* Why Choose Us */

.why-us { padding: 90px 0; }
.why-us .container { text-align: center; }
.why-us h2 { max-width: 42ch; margin: 0 auto 48px; }

.why-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  text-align: left;
}

.why-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 26px 20px;
}

.why-card i { font-size: 22px; color: var(--accent-2); margin-bottom: 14px; }
.why-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
.why-card p { color: var(--muted); font-size: 13.5px; }

/* Pricing */

.pricing {
  background: var(--bg-alt);
  padding: 90px 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}

.pricing .container { text-align: center; }
.pricing h2 { margin: 0 auto 48px; }

.pricing-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 22px;
  text-align: left;
}

.price-card {
  position: relative;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 30px 24px;
  display: flex;
  flex-direction: column;
}

.price-card.featured {
  border-color: var(--accent);
  box-shadow: 0 12px 30px rgba(0, 217, 163, 0.12);
}

.badge {
  position: absolute;
  top: -13px;
  left: 24px;
  font-family: var(--font-mono);
  font-size: 11px;
  background: var(--accent);
  color: #06120e;
  padding: 5px 12px;
  border-radius: 100px;
  font-weight: 500;
}

.price-card h3 { font-size: 18px; font-weight: 600; margin-bottom: 10px; }

.price-card .price {
  font-family: var(--font-mono);
  font-size: 26px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 20px;
}

.price-card .price span { font-size: 13px; color: var(--muted); font-weight: 400; }

.price-card ul { margin-bottom: 24px; flex-grow: 1; }

.price-card li {
  font-size: 13.5px;
  color: var(--muted);
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 10px;
}

.price-card li i { color: var(--accent); margin-top: 3px; font-size: 11px; }

.price-card .btn-primary,
.price-card .btn-secondary {
  text-align: center;
  padding: 12px 20px;
  font-size: 14px;
}

/* Testimonial grid (3-up) */

.testimonial-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  max-width: none;
}

.testimonial-grid .testimonial { max-width: none; margin: 0; }
.stars { color: var(--accent-2); letter-spacing: 2px; font-size: 14px; }

/* Blog */

.blog { padding: 90px 0; }
.blog .container { text-align: center; }
.blog h2 { margin: 0 auto 48px; }

.blog-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
  text-align: left;
}

.blog-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 28px 24px;
}

.blog-card .stat-tag { display: inline-block; margin-bottom: 14px; }
.blog-card h3 { font-size: 17px; font-weight: 600; margin-bottom: 10px; }
.blog-card p { color: var(--muted); font-size: 14px; }

/* Contact layout (info + form) */

.contact-container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 48px;
  text-align: left;
  max-width: var(--container);
}

.contact-info p { color: var(--muted); margin-bottom: 24px; max-width: 44ch; }

.contact-list { margin-bottom: 24px; }

.contact-list li {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 15px;
  margin-bottom: 12px;
  color: var(--ink);
}

.contact-list li i { color: var(--accent); width: 18px; }

.contact-cta { margin-bottom: 24px; }
.contact-cta .btn-primary { display: inline-flex; align-items: center; gap: 8px; }

.map-wrap {
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
}

/* Cookie banner */

.cookie-banner {
  position: fixed;
  left: 20px;
  right: 20px;
  bottom: 20px;
  max-width: 560px;
  margin: 0 auto;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  display: none;
  align-items: center;
  gap: 16px;
  justify-content: space-between;
  z-index: 300;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
}

.cookie-banner.show { display: flex; }
.cookie-banner p { font-size: 13.5px; color: var(--muted); }
.cookie-banner button { padding: 10px 18px; font-size: 13px; white-space: nowrap; }

/* Responsive additions */

@media (max-width: 1024px) {
  .why-grid { grid-template-columns: repeat(3, 1fr); }
  .pricing-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 900px) {
  .nav-toggle { display: block; }

  .nav-links {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--bg-alt);
    border-bottom: 1px solid var(--line);
    flex-direction: column;
    padding: 20px 24px;
    gap: 18px;
    display: none;
  }

  .nav-links.open { display: flex; }

  .mission-vision,
  .testimonial-grid,
  .blog-grid,
  .contact-container {
    grid-template-columns: 1fr;
  }

  .why-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 640px) {
  .why-grid,
  .pricing-grid {
    grid-template-columns: 1fr;
  }

  .cookie-banner {
    flex-direction: column;
    align-items: flex-start;
  }
}

</style>
